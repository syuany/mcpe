# ==============================================================================
# Minecraft Cluster (mc-cluster) Redis 缓存与分布式锁节点配置
# ==============================================================================

# 网络绑定与端口
bind 0.0.0.0
port 6379
protected-mode no
tcp-backlog 511
timeout 0
tcp-keepalive 300

# 通用设置
daemonize no
supervised no
loglevel notice

# 持久化配置 (RDB 快照 + AOF 双重兜底)
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# AOF 配置
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# 内存限制与缓存淘汰策略
maxmemory 256mb
maxmemory-policy volatile-lru
maxmemory-samples 5

# 慢查询日志监控
slowlog-log-slower-than 10000
slowlog-max-len 128

# 延迟监控
latency-monitor-threshold 100

listeners:
- query_port: 25565
  motd: '&aMCPE Cluster Network &7[BungeeCord + C++ Microservice]'
  tab_list: GLOBAL_PING
  query_enabled: false
  proxy_protocol: false
  forced_hosts: {}
  ping_passthrough: false
  priorities:
  - lobby
  bind_local_address: true
  host: 0.0.0.0:25565
  max_players: 1000
  tab_size: 60
  force_default_server: true

remote_ping_timeout: 5000
remote_ping_cache: -1
network_compression_threshold: 256
permissions:
  default:
  - bungeecord.command.server
  - bungeecord.command.list
  admin:
  - bungeecord.command.alert
  - bungeecord.command.end
  - bungeecord.command.reload

timeout: 30000
servers:
  lobby:
    motd: '&aMCPE C++ Lobby'
    address: mcpe-lobby:25566
    restricted: false

player_limit: -1
ip_forward: true
online_mode: false

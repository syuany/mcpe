# ==============================================================================
# EnderVault 分布式数据代理服务配置文件
# ==============================================================================

server:
  port: 8080
  mode: release # debug | release
  read_timeout: 5s
  write_timeout: 5s

database:
  driver: mysql
  # 容器内部通信默认使用服务名 mysql，外部开发可替换为 127.0.0.1
  dsn: "mc_user:mc_cluster_secret@(mysql:3306)/mc_cluster?charset=utf8mb4&parseTime=True&loc=Local"
  max_idle_conns: 20
  max_open_conns: 100
  conn_max_lifetime: 300s

redis:
  addr: "redis:6379"
  password: ""
  db: 0
  pool_size: 100
  min_idle_conns: 20

batch_writer:
  channel_buffer_size: 10000
  batch_size: 100
  flush_interval_ms: 200
